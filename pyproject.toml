[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askcrossroads"
version = "0.1.0"
description = "Ask questions of UK public data in a Crossroads-UK database, in plain English."
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "wpatke" }]
keywords = ["uk", "public-data", "road-safety", "stats19", "weather", "duckdb", "natural-language", "sql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "duckdb>=2.0",
  "anthropic>=1.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # FastAPI's TestClient. Already installed by the anthropic SDK, listed because the tests
  # import it directly.
  "httpx2>=2.0",
  # Drives a real, invisible Chromium in tests/test_browser.py, so the page is checked the way a
  # person would see it. A Python package: the project still has no Node toolchain. After
  # installing, download its browser once with:
  #   .venv/bin/python -m playwright install chromium
  "playwright>=1.48",
  # Reads tests/integration/answers.yaml, the answer set's questions and expected numbers.
  "pyyaml>=6.0",
]

[project.scripts]
askcrossroads = "askcrossroads.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/askcrossroads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are slow, need an Anthropic API key, and need a real Crossroads-UK
# build. They are deselected by default so the normal suite stays fast, offline and
# deterministic (spec §11.1). A person runs them deliberately with:
#   pytest -m integration
addopts = "-m 'not integration'"
markers = [
  "integration: real API calls and/or a real Crossroads-UK build (slow, needs a key and network); deselected by default, run with -m integration",
  "browser: drives the page in a real headless Chromium (Playwright); skipped when Chromium is not installed. Part of the default run; exclude with -m 'not browser'",
]
