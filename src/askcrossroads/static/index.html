<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AskCrossroads</title>
  <!-- The small logo shown in the browser tab. -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <!-- Sets light or dark before anything is drawn, so the page never flashes the wrong
       colours. It must stay here in <head>. -->
  <script src="theme.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="title-row">
        <h1>AskCrossroads</h1>
        <!-- Switches between light and dark. theme.js gives it its label. The moon shows in
             light mode (press for dark), the sun in dark mode (press for light). -->
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch theme">
          <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
          </svg>
          <svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2
                     M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
      <!-- Which database is loaded, and what built it. Filled in by app.js. A short line
           (version and build date) that opens, when clicked, into the full list. The list
           stays hidden until there is something to show, and the line cannot be opened
           while it is hidden. -->
      <details id="provenance" class="provenance">
        <summary id="provenance-summary">Reading the database…</summary>
        <dl id="provenance-details" hidden></dl>
        <!-- The page's one outside link: Crossroads-UK's own account of its sources and how it
             builds the file, so the person can judge the data behind every answer. Nothing is
             fetched unless they click it, and it opens in a new tab so the answer stays put. -->
        <p class="provenance-link">
          <a href="https://github.com/wpatke/crossroads-uk/blob/main/docs/methodology.md"
             target="_blank" rel="noopener noreferrer">Where this data comes from, and how
            Crossroads-UK builds it</a>
        </p>
      </details>
    </header>

    <form id="ask-form" data-state="idle">
      <label for="question" class="visually-hidden">Your question</label>
      <textarea id="question" rows="2" autofocus
                placeholder="Ask a question about this database in plain English"></textarea>
      <div class="controls">
        <!-- The page's one control: Ask, which becomes Stop while a question runs. -->
        <button id="ask-button" type="submit">Ask</button>
        <span id="progress" class="muted small" aria-live="polite"></span>
      </div>
    </form>

    <!-- One answer, top to bottom: a message, the truncation notice, the chart, the table,
         the AI note, then the SQL that ran. app.js shows only the parts an answer needs. -->
    <section id="answer" hidden>
      <p id="message" class="message" aria-live="polite" hidden></p>
      <p id="truncation" class="notice" hidden></p>
      <div id="chart" hidden></div>
      <p id="chart-note" class="muted small" hidden></p>
      <div id="table-wrap" class="table-wrap" hidden>
        <table id="results"></table>
      </div>
      <!-- Shown under every answer the query produced, rows or none. The SQL can run without
           error and still answer a slightly different question, which a person who does not
           write SQL cannot spot, so the page says so every time. -->
      <p id="ai-note" class="muted small" hidden>
        An AI wrote the query behind this answer, and it can be wrong. The SQL below is exactly
        what ran. Asking the question another way and comparing the answers is a quick check.
      </p>
      <section id="sql-section" hidden>
        <h2>SQL</h2>
        <pre id="sql" hidden></pre>
        <ol id="attempts"></ol>
      </section>
    </section>
  </main>

  <!-- The chart libraries, kept in this folder so charts work with no internet connection.
       They must load before app.js, which uses them. -->
  <script src="vendor/vega.min.js"></script>
  <script src="vendor/vega-lite.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
